languages: ["java"]
features:
  - name: api
    scopes:
      - match: module
        prefix: "{{dot .Module.Name}}/"
        documents:
          - source: "libs.versions.toml"
            target: "gradle/libs.versions.toml"
            raw: true
          - source: "settings.gradle.tpl"
            target: "settings.gradle"
          - source: "gradle.properties"
            target: "gradle.properties"
            raw: true
          - source: "api/build.gradle.tpl"
            target: "{{dot .Module.Name}}_api/build.gradle"
          - source: "api/additions.gradle.tpl"
            target: "{{dot .Module.Name}}_api/additions.gradle"
      - match: interface
        prefix: "{{dot .Module.Name}}/{{dot .Module.Name}}_api/src/main/java/{{dot .Module.Name}}/{{dot .Module.Name}}_api/"
        documents:
          - source: "api/eventlistener.java.tpl"
            target: "I{{Camel .Interface.Name }}EventListener.java"
          - source: "api/abstract.java.tpl"
            target: "Abstract{{Camel .Interface.Name}}.java"
          - source: "api/interface.java.tpl"
            target: "I{{Camel .Interface.Name}}.java"
      - match: struct
        prefix: "{{dot .Module.Name}}/{{dot .Module.Name}}_api/src/main/java/{{dot .Module.Name}}/{{dot .Module.Name}}_api/"
        documents:
          - source: "api/struct.java.tpl"
            target: "{{Camel .Struct.Name }}.java"
      - match: enum
        prefix: "{{dot .Module.Name}}/{{dot .Module.Name}}_api/src/main/java/{{dot .Module.Name}}/{{dot .Module.Name}}_api/"
        documents:
          - source: "api/enum.java.tpl"
            target: "{{Camel .Enum.Name }}.java"
  - name: stubs
    requires:
      - api
    scopes:
      - match: module
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_impl/"
        documents:
          - source: "stub/build.gradle.tpl"
            target: "build.gradle"
          - source: "stub/additions.gradle.tpl"
            target: "additions.gradle"
      - match: interface
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_impl/src/main/java/{{dot .Module.Name}}/{{camel .Module.Name}}_impl/"
        documents:
          - source: "stub/implservice.java.tpl"
            target: "{{Camel .Interface.Name}}Service.java"
  - name: android
    requires:
      - api
      - stubs
    scopes:
      - match: module
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_android_service/"
        documents:
          - source: "android/service/build.gradle.tpl"
            target: "build.gradle"
          - source: "android/service/additions.gradle.tpl"
            target: "additions.gradle"
          - source: "android/service/AndroidManifest.xml.tpl"
            target: "src/main/AndroidManifest.xml"
      - match: interface
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_android_service/src/main/java/{{dot .Module.Name}}/{{camel .Module.Name}}_android_service/"
        documents:
          - source: "android/service/iservicefactory.java.tpl"
            target: "I{{Camel .Interface.Name}}ServiceFactory.java"
          - source: "android/service/serviceadapter.java.tpl"
            target: "{{Camel .Interface.Name}}ServiceAdapter.java"
          - source: "android/service/implservicefactory.java.tpl"
            target: "{{Camel .Interface.Name}}ServiceFactory.java"
          - source: "android/service/implservicestarter.java.tpl"
            target: "{{Camel .Interface.Name }}ServiceStarter.java"
      - match: interface
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_android_service/src/test/java/{{dot .Module.Name}}/{{camel .Module.Name}}_android_service/"
        documents:
          - source: "android/service/serviceadaptertest.java.tpl"
            target: "{{Camel .Interface.Name}}ServiceAdapterTest.java"
      - match: module
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_android_messenger/"
        documents:
          - source: "android/messenger/build.gradle.tpl"
            target: "build.gradle"
          - source: "android/messenger/additions.gradle.tpl"
            target: "additions.gradle"
      - match: interface
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_android_messenger/src/main/java/{{dot .Module.Name}}/{{camel .Module.Name}}_android_messenger/"
        documents:
          - source: "android/messenger/messages.java.tpl"
            target: "{{Camel .Interface.Name}}MessageType.java"
      - match: struct
        prefix: "{{dot .Module.Name}}/{{dot .Module.Name}}_android_messenger/src/main/java/{{dot .Module.Name}}/{{dot .Module.Name}}_android_messenger/"
        documents:
          - source: "android/messenger/structparcelable.java.tpl"
            target: "{{Camel .Struct.Name }}Parcelable.java"
      - match: module
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_android_client/"
        documents:
          - source: "android/client/build.gradle.tpl"
            target: "build.gradle"
          - source: "android/client/additions.gradle.tpl"
            target: "additions.gradle"
      - match: interface
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_android_client/src/main/java/{{dot .Module.Name}}/{{camel .Module.Name}}_android_client/"
        documents:
          - source: "android/client/client.java.tpl"
            target: "{{Camel .Interface.Name}}Client.java"
      - match: interface
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_android_client/src/test/java/{{dot .Module.Name}}/{{camel .Module.Name}}_android_client/"
        documents:
          - source: "android/client/clienttest.java.tpl"
            target: "{{Camel .Interface.Name}}ClientTest.java"
  - name: unreal
    requires:
      - api
      - android
    scopes:
      - match: interface
        prefix: "{{dot .Module.Name}}/unreal{{dot .Module.Name}}service/"
        documents:
          - source: "unreal/service/unrealservicefactory.java.tpl"
            target: "Unreal{{Camel .Interface.Name}}ServiceFactory.java"
          - source: "unreal/service/unrealservice.java.tpl"
            target: "Unreal{{Camel .Interface.Name}}Service.java"
          - source: "unreal/service/unrealservicestarter.java.tpl"
            target: "Unreal{{Camel .Interface.Name }}ServiceStarter.java"
  - name: testclientapp
    requires:
      - api
      - android
    scopes:
      - match: module
        prefix: "{{dot .Module.Name}}/{{dot .Module.Name}}_client_example/"
        documents:
          - source: "testclientapp/build.gradle.tpl"
            target: "build.gradle"
      - match: module
        prefix: "{{dot .Module.Name}}/{{dot .Module.Name}}_client_example/src/main/"
        documents:
          - source: "testclientapp/AndroidManifest.xml.tpl"
            target: "AndroidManifest.xml"
          - source: "testclientapp/application.java.tpl"
            target: "java/{{dot .Module.Name}}/{{dot .Module.Name}}_client_example/{{Camel .Module.Name}}TestClientApp.java"
          - source: "testclientapp/res/drawable/ic_launcher_background.xml"
            target: "res/drawable/ic_launcher_background.xml"
            raw: true
          - source: "testclientapp/res/drawable/ic_launcher_foreground.xml"
            target: "res/drawable/ic_launcher_foreground.xml"
            raw: true
          - source: "testclientapp/res/values/colors.xml"
            target: "res/values/colors.xml"
            raw: true
          - source: "testclientapp/res/values/strings.xml.tpl"
            target: "res/values/strings.xml"
          - source: "testclientapp/res/values/themes.xml"
            target: "res/values/themes.xml"
            raw: true
          - source: "testclientapp/res/values-night/themes.xml"
            target: "res/values-night/themes.xml"
            raw: true
          - source: "testclientapp/res/xml/backup_rules.xml"
            target: "res/xml/backup_rules.xml"
            raw: true
          - source: "testclientapp/res/xml/data_extraction_rules.xml"
            target: "res/xml/data_extraction_rules.xml"
            raw: true
          - source: "testclientapp/res/mipmap-anydpi/ic_launcher.xml"
            target: "res/mipmap-anydpi/ic_launcher.xml"
            raw: true
          - source: "testclientapp/res/mipmap-anydpi/ic_launcher_round.xml"
            target: "res/mipmap-anydpi/ic_launcher_round.xml"
            raw: true
          - source: "testclientapp/res/mipmap-hdpi/ic_launcher.webp"
            target: "res/mipmap-hdpi/ic_launcher.webp"
            raw: true
          - source: "testclientapp/res/mipmap-hdpi/ic_launcher_round.webp"
            target: "res/mipmap-hdpi/ic_launcher_round.webp"
            raw: true
          - source: "testclientapp/res/mipmap-mdpi/ic_launcher.webp"
            target: "res/mipmap-mdpi/ic_launcher.webp"
            raw: true
          - source: "testclientapp/res/mipmap-mdpi/ic_launcher_round.webp"
            target: "res/mipmap-mdpi/ic_launcher_round.webp"
            raw: true
          - source: "testclientapp/res/mipmap-xhdpi/ic_launcher.webp"
            target: "res/mipmap-xhdpi/ic_launcher.webp"
            raw: true
          - source: "testclientapp/res/mipmap-xhdpi/ic_launcher_round.webp"
            target: "res/mipmap-xhdpi/ic_launcher_round.webp"
            raw: true
          - source: "testclientapp/res/mipmap-xxhdpi/ic_launcher.webp"
            target: "res/mipmap-xxhdpi/ic_launcher.webp"
            raw: true
          - source: "testclientapp/res/mipmap-xxhdpi/ic_launcher_round.webp"
            target: "res/mipmap-xxhdpi/ic_launcher_round.webp"
            raw: true
          - source: "testclientapp/res/mipmap-xxxhdpi/ic_launcher.webp"
            target: "res/mipmap-xxxhdpi/ic_launcher.webp"
            raw: true
          - source: "testclientapp/res/mipmap-xxxhdpi/ic_launcher_round.webp"
            target: "res/mipmap-xxxhdpi/ic_launcher_round.webp"
            raw: true