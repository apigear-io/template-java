languages: ["java"]
features:
  - name: api
    scopes:
      - match: interface
        prefix: "{{dot .Module.Name}}/api/"
        documents:
          - source: "api/interface.java.tpl"
            target: "I{{Camel .Interface.Name }}EventListener.java"
          - source: "api/abstract.java.tpl"
            target: "Abstract{{Camel .Interface.Name}}.java"
          - source: "api/interface.java.tpl"
            target: "I{{Camel .Interface.Name}}.java"
      - match: struct
        prefix: "{{dot .Module.Name}}/api/"
        documents:
          - source: "api/struct.java.tpl"
            target: "{{Camel .Struct.Name }}.java"
      - match: enum
        prefix: "{{dot .Module.Name}}/api/"
        documents:
          - source: "api/enum.java.tpl"
            target: "{{Camel .Enum.Name }}.java"
  - name: android
    scopes:
      - match: interface
        prefix: "{{dot .Module.Name}}/android/service/"
        documents:
          - source: "android/service/iservicefactory.java.tpl"
            target: "{{Camel .Interface.Name}}ServiceFactory.java"
          - source: "android/service/serviceadapter.java.tpl"
            target: "{{Camel .Interface.Name}}ServiceAdapter.java"
  - name: unreal
    scopes:
      - match: interface
        prefix: "{{dot .Module.Name}}/unreal/{{dot .Module.Name}}service/"
        documents:
          - source: "unreal/service/unrealservicefactory.java.tpl"
            target: "{{Camel .Interface.Name}}ServiceFactory.java"
          - source: "unreal/service/unrealservice.java.tpl"
            target: "{{Camel .Interface.Name}}Service.java"
          - source: "unreal/service/unrealservicestarter.java.tpl"
            target: "{{Camel .Interface.Name}}Starter.java"
