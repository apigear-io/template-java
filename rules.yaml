            target: "AndroidManifest.xml"
          - source: "testclientapp/application.java.tpl"
            target: "java/{{camel .Module.Name}}/{{camel .Module.Name}}_client_example/{{Camel .Module.Name}}TestClientApp.java"
          - source: "testappres/res/drawable/ic_launcher_background.xml"
            target: "res/drawable/ic_launcher_background.xml"
            raw: true
          - source: "testappres/res/drawable/ic_launcher_foreground.xml"
            target: "res/drawable/ic_launcher_foreground.xml"
            raw: true
          - source: "testappres/res/values/colors.xml"
            target: "res/values/colors.xml"
            raw: true
          - source: "testappres/res/values/stringsclient.xml.tpl"
            target: "res/values/strings.xml"
          - source: "testappres/res/values/themes.xml"
            target: "res/values/themes.xml"
            raw: true
          - source: "testappres/res/values-night/themes.xml"
            target: "res/values-night/themes.xml"
            raw: true
          - source: "testappres/res/xml/backup_rules.xml"
            target: "res/xml/backup_rules.xml"
            raw: true
          - source: "testappres/res/xml/data_extraction_rules.xml"
            target: "res/xml/data_extraction_rules.xml"
            raw: true
          - source: "testappres/res/mipmap-anydpi/ic_launcher.xml"
            target: "res/mipmap-anydpi/ic_launcher.xml"
            raw: true
          - source: "testappres/res/mipmap-anydpi/ic_launcher_round.xml"
            target: "res/mipmap-anydpi/ic_launcher_round.xml"
            raw: true
          - source: "testappres/res/mipmap-hdpi/ic_launcher.webp"
            target: "res/mipmap-hdpi/ic_launcher.webp"
            raw: true
          - source: "testappres/res/mipmap-hdpi/ic_launcher_round.webp"
            target: "res/mipmap-hdpi/ic_launcher_round.webp"
            raw: true
          - source: "testappres/res/mipmap-mdpi/ic_launcher.webp"
            target: "res/mipmap-mdpi/ic_launcher.webp"
            raw: true
          - source: "testappres/res/mipmap-mdpi/ic_launcher_round.webp"
            target: "res/mipmap-mdpi/ic_launcher_round.webp"
            raw: true
          - source: "testappres/res/mipmap-xhdpi/ic_launcher.webp"
            target: "res/mipmap-xhdpi/ic_launcher.webp"
            raw: true
          - source: "testappres/res/mipmap-xhdpi/ic_launcher_round.webp"
            target: "res/mipmap-xhdpi/ic_launcher_round.webp"
            raw: true
          - source: "testappres/res/mipmap-xxhdpi/ic_launcher.webp"
            target: "res/mipmap-xxhdpi/ic_launcher.webp"
            raw: true
          - source: "testappres/res/mipmap-xxhdpi/ic_launcher_round.webp"
            target: "res/mipmap-xxhdpi/ic_launcher_round.webp"
            raw: true
          - source: "testappres/res/mipmap-xxxhdpi/ic_launcher.webp"
            target: "res/mipmap-xxxhdpi/ic_launcher.webp"
            raw: true
          - source: "testappres/res/mipmap-xxxhdpi/ic_launcher_round.webp"
            target: "res/mipmap-xxxhdpi/ic_launcher_round.webp"
            raw: true

  - name: testserviceapp
    requires:
      - api
      - android
    scopes:
      - match: module
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}serviceexample/"
        documents:
