languages: ["java"]
features:
  - name: api
    scopes:
      - match: module
        prefix: "{{dot .Module.Name}}/"
        documents:
          - source: "libs.versions.toml"
            target: "gradle/libs.versions.toml"
            raw: true
          - source: "settings.gradle.tpl"
            target: "settings.gradle"
          - source: "gradle.properties"
            target: "gradle.properties"
            raw: true
          - source: "api/build.gradle.tpl"
            target: "{{dot .Module.Name}}_api/build.gradle"
          - source: "api/additions.gradle.tpl"
            target: "{{dot .Module.Name}}_api/additions.gradle"
      - match: interface
        prefix: "{{dot .Module.Name}}/{{dot .Module.Name}}_api/src/main/java/{{dot .Module.Name}}/{{dot .Module.Name}}_api/"
        documents:
          - source: "api/eventlistener.java.tpl"
            target: "I{{Camel .Interface.Name }}EventListener.java"
          - source: "api/abstract.java.tpl"
            target: "Abstract{{Camel .Interface.Name}}.java"
          - source: "api/interface.java.tpl"
            target: "I{{Camel .Interface.Name}}.java"
      - match: struct
        prefix: "{{dot .Module.Name}}/{{dot .Module.Name}}_api/src/main/java/{{dot .Module.Name}}/{{dot .Module.Name}}_api/"
        documents:
          - source: "api/struct.java.tpl"
            target: "{{Camel .Struct.Name }}.java"
      - match: enum
        prefix: "{{dot .Module.Name}}/{{dot .Module.Name}}_api/src/main/java/{{dot .Module.Name}}/{{dot .Module.Name}}_api/"
        documents:
          - source: "api/enum.java.tpl"
            target: "{{Camel .Enum.Name }}.java"
  - name: stubs
    requires:
      - api
    scopes:
      - match: module
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_impl/"
        documents:
          - source: "stub/build.gradle.tpl"
            target: "build.gradle"
          - source: "stub/additions.gradle.tpl"
            target: "additions.gradle"
      - match: interface
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_impl/src/main/java/{{dot .Module.Name}}/{{camel .Module.Name}}_impl/"
        documents:
          - source: "stub/implservice.java.tpl"
            target: "{{Camel .Interface.Name}}Service.java"
  - name: android
    requires:
      - api
      - stubs
    scopes:
      - match: module
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_android_service/"
        documents:
          - source: "android/service/build.gradle.tpl"
            target: "build.gradle"
          - source: "android/service/additions.gradle.tpl"
            target: "additions.gradle"
          - source: "android/service/AndroidManifest.xml.tpl"
            target: "src/main/AndroidManifest.xml"
      - match: interface
        prefix: "{{dot .Module.Name}}/{{camel .Module.Name}}_android_service/src/main/java/{{dot .Module.Name}}/{{camel .Module.Name}}_android_service/"
        documents:
          - source: "android/service/iservicefactory.java.tpl"
            target: "I{{Camel .Interface.Name}}ServiceFactory.java"
          - source: "android/service/serviceadapter.java.tpl"
            target: "{{Camel .Interface.Name}}ServiceAdapter.java"
          - source: "android/service/implservicefactory.java.tpl"
            target: "{{Camel .Interface.Name}}ServiceFactory.java"
          - source: "android/service/implservicestarter.java.tpl"
            target: "{{Camel .Interface.Name }}ServiceStarter.java"

