engines:
  cli: ">= v0.50.2"
languages: ["java"]
features:
  - name: api
    scopes:
      - match: module
        prefix: "{{camel .Module.Name}}/"
        documents:
          - source: "libs.versions.toml"
            target: "gradle/libs.versions.toml"
            raw: true
          - source: "settings.gradle.tpl"
            target: "settings.gradle"
          - source: "gradle.properties"
            target: "gradle.properties"
            raw: true
          - source: "api/build.gradle.tpl"
            target: "{{camel .Module.Name}}_api/build.gradle"
          - source: "api/additions.gradle.tpl"
            target: "{{camel .Module.Name}}_api/additions.gradle"
          - source: "api/testhelper.java.tpl"
            target: "{{camel .Module.Name}}_api/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_api/{{Camel .Module.Name}}TestHelper.java"
          - source: "api/remoteoperationexception.java.tpl"
            target: "{{camel .Module.Name}}_api/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_api/RemoteOperationException.java"
      - match: interface
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_api/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_api/"
        documents:
          - source: "api/eventlistener.java.tpl"
            target: "I{{Camel .Interface.Name }}EventListener.java"
          - source: "api/abstract.java.tpl"
            target: "Abstract{{Camel .Interface.Name}}.java"
          - source: "api/interface.java.tpl"
            target: "I{{Camel .Interface.Name}}.java"
      - match: struct
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_api/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_api/"
        documents:
          - source: "api/struct.java.tpl"
            target: "{{Camel .Struct.Name }}.java"
      - match: enum
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_api/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_api/"
        documents:
          - source: "api/enum.java.tpl"
            target: "{{Camel .Enum.Name }}.java"
  - name: stubs
    requires:
      - api
    scopes:
      - match: module
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_impl/"
        documents:
          - source: "stub/build.gradle.tpl"
            target: "build.gradle"
          - source: "stub/additions.gradle.tpl"
            target: "additions.gradle"
      - match: interface
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_impl/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_impl/"
        documents:
          - source: "stub/implservice.java.tpl"
            target: "{{Camel .Interface.Name}}Service.java"
  - name: android
    requires:
      - api
      - stubs
    scopes:
      - match: module
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_android_service/"
        documents:
          - source: "android/service/build.gradle.tpl"
            target: "build.gradle"
          - source: "android/service/additions.gradle.tpl"
            target: "additions.gradle"
          - source: "android/service/AndroidManifest.xml.tpl"
            target: "src/main/AndroidManifest.xml"
      - match: interface
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_android_service/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_android_service/"
        documents:
          - source: "android/service/iserviceprovider.java.tpl"
            target: "I{{Camel .Interface.Name}}ServiceProvider.java"
          - source: "android/service/serviceadapter.java.tpl"
            target: "{{Camel .Interface.Name}}ServiceAdapter.java"
          - source: "android/service/implserviceprovider.java.tpl"
            target: "{{Camel .Interface.Name}}ServiceProvider.java"
          - source: "android/service/implservicestarter.java.tpl"
            target: "{{Camel .Interface.Name }}ServiceStarter.java"
          - source: "android/service/baseservicelifecyclecontroller.java.tpl"
            target: "{{Camel .Interface.Name }}BaseServiceLifecycleController.java"
      - match: interface
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_android_service/src/test/java/{{camel .Module.Name}}/{{camel .Module.Name}}_android_service/"
        documents:
          - source: "android/service/serviceadaptertest.java.tpl"
            target: "{{Camel .Interface.Name}}ServiceAdapterTest.java"
      - match: module
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_android_messenger/"
        documents:
          - source: "android/messenger/build.gradle.tpl"
            target: "build.gradle"
          - source: "android/messenger/additions.gradle.tpl"
            target: "additions.gradle"
      - match: interface
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_android_messenger/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_android_messenger/"
        documents:
          - source: "android/messenger/messages.java.tpl"
            target: "{{Camel .Interface.Name}}MessageType.java"
          - source: "android/messenger/interfaceparcelable.java.tpl"
            target: "{{Camel .Interface.Name }}Parcelable.java"
      - match: struct
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_android_messenger/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_android_messenger/"
        documents:
          - source: "android/messenger/structparcelable.java.tpl"
            target: "{{Camel .Struct.Name }}Parcelable.java"
      - match: enum
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_android_messenger/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_android_messenger/"
        documents:
          - source: "android/messenger/enumparcelable.java.tpl"
            target: "{{Camel .Enum.Name }}Parcelable.java"
      - match: extern
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_android_messenger/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_android_messenger/"
        documents:
          - source: "android/messenger/externparcelable.java.tpl"
            target: "{{Camel .Extern.Name }}Parcelable.java"
      - match: module
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_android_client/"
        documents:
          - source: "android/client/build.gradle.tpl"
            target: "build.gradle"
          - source: "android/client/additions.gradle.tpl"
            target: "additions.gradle"
      - match: interface
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_android_client/src/main/java/{{camel .Module.Name}}/{{camel .Module.Name}}_android_client/"
        documents:
          - source: "android/client/client.java.tpl"
            target: "{{Camel .Interface.Name}}Client.java"
      - match: interface
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}_android_client/src/test/java/{{camel .Module.Name}}/{{camel .Module.Name}}_android_client/"
        documents:
          - source: "android/client/clienttest.java.tpl"
            target: "{{Camel .Interface.Name}}ClientTest.java"
  - name: jnibridge
    requires:
      - api
      - android
    scopes:
      - match: interface
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}jniservice/"
        documents:
          - source: "jnibridge/service/jnibridgeserviceprovider.java.tpl"
            target: "{{Camel .Interface.Name}}JniServiceProvider.java"
          - source: "jnibridge/service/jnibridgeservice.java.tpl"
            target: "{{Camel .Interface.Name}}JniService.java"
          - source: "jnibridge/service/jnibridgeservicestarter.java.tpl"
            target: "{{Camel .Interface.Name }}JniServiceStarter.java"
      - match: interface
        prefix: "{{camel .Module.Name}}/{{camel .Module.Name}}jniclient/"
        documents:
          - source: "jnibridge/client/jnibridgeclient.java.tpl"
            target: "{{Camel .Interface.Name}}JniClient.java"
