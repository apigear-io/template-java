plugins {
    alias(libs.plugins.android.application)
}

group = "tbSimple"
version = "1.0.0"

android {
    namespace 'tbSimple.tbSimple_client_example'
    compileSdk 35

    defaultConfig {
        applicationId "tbSimple.tbSimple_client_example"
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation project(':tbSimple_api')
    implementation project(':tbSimple_android_messenger')
    implementation project(':tbSimple_android_client')
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}