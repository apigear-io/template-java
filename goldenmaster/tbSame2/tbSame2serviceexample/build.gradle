plugins {
    alias(libs.plugins.android.application)
}

group = "tbSame2"
version = "1.0.0"


android {
    namespace 'tbSame2.tbSame2serviceexample'
    compileSdk 35

    defaultConfig {
        applicationId "tbSame2.tbSame2serviceexample"
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation project(':tbSame2_api')
    implementation project(':tbSame2_android_messenger')
    implementation project(':tbSame2_android_service')
    implementation project(':tbSame2_impl')
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}